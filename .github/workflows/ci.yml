name: CI/CD Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    test:
        name: Build & Test
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: app
        steps:
            - name: Checkout du code
              uses: actions/checkout@v4

            - name: Installer Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.25"

            - name: Télécharger les dépendances
              run: go mod download

            - name: Lancer les tests
              run: go test -v ./...

            - name: Vérifier que le build compile
              run: go build -o /tmp/hello-app .

    build-and-push:
        name: Build & Push image Docker
        needs: test
        runs-on: ubuntu-latest
        if: github.event_name == 'push'
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout du code
              uses: actions/checkout@v4

            - name: Connexion à GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extraire les métadonnées (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=sha,prefix=,format=short
                      type=raw,value=latest

            - name: Build et push de l'image
              uses: docker/build-push-action@v6
              with:
                  context: ./app
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      VERSION=${{ github.sha }}

apiVersion: v1
kind: Service
metadata:
  name: orchestrator-healthz
spec:
  selector:
    app: orchestrator
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081

---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-webhook
spec:
  selector:
    app: orchestrator
    role-leader: "true"
  type: NodePort
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30080
